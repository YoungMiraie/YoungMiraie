<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Diogo Stein. I build LLM agents for business software."><title>Diogo Stein. I build LLM agents for business software.</title><defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern><radialGradient id="glow" cx="0.82" cy="0.5" r="0.55"><stop offset="0" stop-color="#C45CFF" stop-opacity="0.24"/><stop offset="1" stop-color="#C45CFF" stop-opacity="0"/></radialGradient><filter id="neon" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.hl{opacity:0}.hl.n1{opacity:1}.pk{opacity:0}.n0{animation:n0 6s infinite}.n1{animation:n1 6s infinite}.n2{animation:n2 6s infinite}.p0{animation:p0 6s infinite}.p1{animation:p1 6s infinite}.bg{animation:bg 6s ease-in-out infinite}@keyframes n0{0%,4%{opacity:0}10%,24%{opacity:1}32%,100%{opacity:0}}@keyframes n1{0%,30%{opacity:0}36%,56%{opacity:1}64%,100%{opacity:0}}@keyframes n2{0%,62%{opacity:0}68%,88%{opacity:1}96%,100%{opacity:0}}@keyframes p0{0%,20%{opacity:0;transform:translateY(0)}22%{opacity:1}32%{opacity:1;transform:translateY(22px)}34%,100%{opacity:0;transform:translateY(22px)}}@keyframes p1{0%,52%{opacity:0;transform:translateY(0)}54%{opacity:1}64%{opacity:1;transform:translateY(22px)}66%,100%{opacity:0;transform:translateY(22px)}}@keyframes bg{0%,100%{opacity:.65}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.n0,.n1,.n2,.p0,.p1,.bg{animation:none}}</style><rect width="1280" height="360" rx="24" fill="#0B0B0D"/><rect width="1280" height="360" rx="24" fill="url(#g)"/><rect width="1280" height="360" rx="24" fill="url(#glow)" class="bg"/><rect x="80" y="92" width="64" height="6" rx="3" fill="#C45CFF" filter="url(#neon)"/><text x="80" y="140" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#C45CFF" letter-spacing="3" text-anchor="start">SOFTWARE ENGINEERING · APPLIED AI</text><text x="76" y="228" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="700" fill="#F5F5F4" letter-spacing="-2" text-anchor="start">Diogo Stein</text><text x="80" y="282" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#A1A1AA" letter-spacing="0" text-anchor="start">I build LLM agents for business software.</text><rect x="850" y="58" width="350" height="70" rx="14" fill="#131316" stroke="#2A2A30"/><rect class="hl n0" x="850" y="58" width="350" height="70" rx="14" fill="none" stroke="#C45CFF" stroke-width="2" filter="url(#neon)"/><text x="872" y="85" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#C45CFF" letter-spacing="2" text-anchor="start">MODEL</text><text x="872" y="111" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#F5F5F4" letter-spacing="0" text-anchor="start">proposes an action</text><line x1="890" y1="128" x2="890" y2="150" stroke="#C45CFF" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.6"/><circle class="pk p0" cx="890" cy="128" r="4.5" fill="#C45CFF" filter="url(#neon)"/><rect x="850" y="150" width="350" height="70" rx="14" fill="#131316" stroke="#2A2A30"/><rect class="hl n1" x="850" y="150" width="350" height="70" rx="14" fill="none" stroke="#C45CFF" stroke-width="2" filter="url(#neon)"/><text x="872" y="177" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#C45CFF" letter-spacing="2" text-anchor="start">BACKEND</text><text x="872" y="203" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#F5F5F4" letter-spacing="0" text-anchor="start">checks scope, then writes</text><line x1="890" y1="220" x2="890" y2="242" stroke="#C45CFF" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.6"/><circle class="pk p1" cx="890" cy="220" r="4.5" fill="#C45CFF" filter="url(#neon)"/><rect x="850" y="242" width="350" height="70" rx="14" fill="#131316" stroke="#2A2A30"/><rect class="hl n2" x="850" y="242" width="350" height="70" rx="14" fill="none" stroke="#C45CFF" stroke-width="2" filter="url(#neon)"/><text x="872" y="269" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#C45CFF" letter-spacing="2" text-anchor="start">PERSON</text><text x="872" y="295" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#F5F5F4" letter-spacing="0" text-anchor="start">takes over when needed</text></svg>
